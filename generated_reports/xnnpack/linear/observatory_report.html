<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observatory: aot_compiler.py</title>
    <style>
        :root {
            /* Light mode colors */
            --bg-primary: #f6f8fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #fafbfc;
            --bg-code: #f4f4fa;
            --text-primary: #24292e;
            --text-secondary: #6a737d;
            --text-inverse: #ffffff;
            --border-color: #e1e4e8;
            --header-bg: #24292e;
            --link-color: #0366d6;
            --link-hover: #0256c7;
            --accent-color: #0366d6;
            --success-color: #28a745;
            --error-color: #d73a49;
            --code-text: #d4d4d4;
            --shadow: rgba(0,0,0,0.1);
            --frame-border: #0366d6;
            --diff-add-bg: #1e3a24;
            --diff-add-color: #8cc696;
            --diff-rem-bg: #4a2626;
            --diff-rem-color: #e09690;
            --diff-deep-add: #2e5c35;
            --diff-deep-rem: #693333;
            --success-bg: #dafbe1;
            --error-bg: #ffebe9;
        }
        
        [data-theme="dark"] {
            /* Dark mode colors */
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --bg-code: #0d1117;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --text-inverse: #c9d1d9;
            --border-color: #30363d;
            --header-bg: #161b22;
            --link-color: #79c0ff;
            --link-hover: #a5d6ff;
            --accent-color: #58a6ff;
            --success-color: #3fb950;
            --error-color: #f85149;
            --code-text: #c9d1d9;
            --shadow: rgba(0,0,0,0.3);
            --frame-border: #58a6ff;
            --diff-add-bg: #1e3a24;
            --diff-add-color: #8cc696;
            --diff-rem-bg: #4a2626;
            --diff-rem-color: #e09690;
            --diff-deep-add: #3a7545;
            --diff-deep-rem: #8a4444;
            --success-bg: #1e3a24;
            --error-bg: #4a2626;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background: var(--bg-primary);
            height: 100vh;
            overflow: hidden;
        }

        /* App Layout */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header trigger zone — invisible strip at top */
        .header-trigger {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            z-index: 201;
        }

        header {
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            transform: translateY(-100%);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            z-index: 200;
        }

        .header-trigger:hover ~ header,
        header:hover {
            transform: translateY(0);
            box-shadow: 0 4px 12px var(--shadow);
        }

        header.hidden {
            transform: translateY(-100%);
        }
        
        [data-theme="dark"] header {
            background: var(--header-bg);
            color: var(--text-inverse);
            border-bottom: none;
        }

        .header-content h1 { font-size: 1.2rem; margin: 0; }
        .header-meta { font-size: 0.85rem; opacity: 0.7; margin-top: 0.2rem; }
        .header-meta span { margin-right: 1.5rem; }
        .header-meta code { background: var(--bg-tertiary); padding: 0.2rem 0.4rem; border-radius: 3px; border: 1px solid var(--border-color); }
        
        [data-theme="dark"] .header-meta code { background: rgba(255,255,255,0.1); border: none; }

        /* Theme Toggle */
        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: var(--hover-color); transform: scale(1.05); }
        
        [data-theme="dark"] .theme-toggle {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }
        [data-theme="dark"] .theme-toggle:hover { background: rgba(255,255,255,0.2); }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar trigger zone — invisible strip on left edge */
        .index-pane-trigger {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 12px;
            z-index: 200;
        }

        /* Index Pane (Sidebar) */
        .index-pane {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 199;
            transform: translateX(-100%);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: none;
        }

        /* Show when trigger zone or pane itself is hovered */
        .index-pane-trigger:hover ~ .index-pane,
        .index-pane:hover {
            transform: translateX(0);
            box-shadow: 4px 0 16px var(--shadow);
        }
        
        .index-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-tertiary);
        }
        .index-header h2 { font-size: 1rem; margin: 0; }

        .index-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            list-style: none;
        }

        .index-item {
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.3rem;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            font-size: 0.9rem;
            border-left: 3px solid transparent;
            border: none;
            background: var(--bg-primary);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .index-item:hover { 
            background: var(--bg-tertiary); 
            box-shadow: 0 2px 4px var(--shadow);
            transform: translateX(2px);
        }
        .index-item.active { 
            background: var(--accent-color); 
            color: white; 
            border-left-color: transparent;
            border-color: var(--accent-color);
            box-shadow: 0 2px 6px var(--shadow);
        }
        .index-item.diff-base { 
            border-left-color: var(--diff-rem-color); 
            background: rgba(224, 150, 144, 0.1);
            border-color: var(--diff-rem-color);
        }
        .index-item.diff-new { 
            border-left-color: var(--diff-add-color); 
            background: rgba(140, 198, 150, 0.1);
            border-color: var(--diff-add-color);
        }
        .index-item.selected { 
            background: rgba(3, 102, 214, 0.1); 
            border-left-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        .index-item.active .badge { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.3); color: white; }
        
        /* Badges */
        .badges { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .badge { font-size: 0.7rem; padding: 0.1rem 0.3rem; border-radius: 3px; font-weight: 600; background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); }
        .badge-error { background: var(--error-bg); border-color: var(--error-color); color: var(--error-color); }
        .badge-success { background: var(--success-bg); border-color: var(--success-color); color: var(--success-color); }

        /* Diff Separator - Blends with background as spacing between records */
        .diff-separator {
            padding: 0.6rem 1rem;
            margin: 0.5rem 0;
            background: var(--bg-secondary);
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            list-style: none;
        }
        .diff-separator:hover {
            background: var(--bg-tertiary);
            border-radius: 4px;
        }
        .diff-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            opacity: 0.7;
        }
        .diff-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }
        .diff-label {
            font-weight: 500;
            color: var(--text-secondary);
        }
        .diff-stats {
            font-family: monospace;
            display: flex;
            gap: 0.4rem;
        }
        .stat-add { color: var(--success-color); font-weight: 600; }
        .stat-rem { color: var(--error-color); font-weight: 600; }

        /* Main Content */
        .main-pane {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            position: relative;
        }
        
        /* Record View */
        .record-view h2 { color: var(--accent-color); border-bottom: 2px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
        
        /* Toggleable Sections */
        .toggle-section { border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
        .toggle-header { background: var(--bg-tertiary); padding: 0.75rem 1rem; font-size: 1rem; font-weight: 600; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .toggle-header.collapsed { border-bottom: none; }
        .toggle-header:hover { background: var(--border-color); }
        .toggle-title { font-size: 1rem; }
        .toggle-content { padding: 1rem; overflow-x: auto; background: var(--bg-secondary); }
        .toggle-content.hidden { display: none; }
        .copy-btn { 
            font-size: 0.75rem; 
            padding: 0.3rem 0.6rem; 
            border: none;
            background: var(--bg-secondary); 
            color: var(--accent-fg); 
            border-radius: 4px; 
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .copy-btn:hover { 
            background: var(--bg-primary); 
            transform: translateY(-3px);
            box-shadow: 0 2px 4px var(--shadow);
        }
        .copy-btn.copied {
            background: var(--success-color);
        }

        /* Tables */
        table.kv-table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.85rem;
        }
        .kv-table th, .kv-table td { 
            padding: 0.4rem 0.8rem; 
            text-align: left; 
            border-bottom: 1px solid var(--border-color); 
        }
        .kv-table td { font-family: var(--font-mono); }
        .kv-table tr:last-child th, .kv-table tr:last-child td { border-bottom: none; }
        .kv-table th { color: var(--text-secondary); font-weight: normal; background: var(--bg-tertiary); }
        
        /* Regular KV tables - 40/60 split */
        .kv-table:not(.comparison-table) th { width: 40%; }
        
        /* Comparison tables - equal width columns */
        .kv-table.comparison-table {
            table-layout: fixed;
        }
        .kv-table.comparison-table th,
        .kv-table.comparison-table td {
            width: auto;
        }

        .split-view { display: flex; height: 100%; gap: 1rem; }
        .split-pane { flex: 1; overflow: auto; border-right: 1px dashed var(--border-color); padding-right: 0.5rem; }
        .split-pane:last-child { border-right: none; padding-right: 0; }
        .split-pane h3 { font-size: 0.9rem; margin-bottom: 0.5rem; color: var(--accent-color); }
        
        /* Utility */
        .hidden { display: none; }
        .btn { padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-tertiary); color: var(--text-primary); }
        .btn:hover { background: var(--bg-secondary); }
        .btn-sm { padding: 0.2rem 0.5rem; border-radius: 4px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-tertiary); font-size: 0.8rem; margin-left: 0.5rem; color: var(--text-primary); }
        .btn-sm:hover { background: var(--bg-secondary); }
        .loading { padding: 2rem; text-align: center; color: var(--text-secondary); font-style: italic; }
        
        .clickable-name { cursor: pointer; color: var(--link-color); text-decoration: underline; }
        .clickable-name:hover { color: var(--link-hover); }
        
        /* Toast Notifications */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            box-shadow: 0 4px 12px var(--shadow);
            border: 1px solid var(--border-color);
            opacity: 0;
            transform: translateY(1rem);
            transition: all 0.3s ease;
            z-index: 1000;
            font-size: 0.9rem;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.toast-success {
            border-left: 4px solid var(--success-color);
        }
        .toast.toast-error {
            border-left: 4px solid var(--error-color);
        }

    </style>
</head>

        const writer = ds.writable.getWriter();
        writer.write(compressed);

            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
        }
        const total = chunks.reduce((n, c) => n + c.length, 0);

// ---- 01_utils.js ----

(function() {
  const OBS = window.__observatory;
  const state = OBS.state;

  function safeStr(val) {
    if (val === null || val === undefined) return '';
    if (typeof val === 'object') return JSON.stringify(val);
    return String(val);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text == null ? '' : String(text);
    return div.innerHTML;
  }

  function showToast(message, type = 'success') {
    const existingToast = document.querySelector('.toast');
    if (existingToast) existingToast.remove();

    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = message;
    document.body.appendChild(toast);

    setTimeout(() => toast.classList.add('show'), 10);
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  function copyTable(tableEl) {
    const rows = Array.from(tableEl.querySelectorAll('tr'));
    const csv = rows
      .map((row) => {
        const cols = Array.from(row.querySelectorAll('td, th'));
        return cols
          .map((col) => `"${col.innerText.replace(/"/g, '""')}"`)
          .join(',');
      })
      .join('\n');

    const html = `<style>table, th, td { border: 1px solid black; border-collapse: collapse; padding: 4px; }</style><table>${tableEl.innerHTML}</table>`;

    try {
      const blobHTML = new Blob([html], { type: 'text/html' });
      const blobText = new Blob([csv], { type: 'text/plain' });
      const clipboardItem = new ClipboardItem({
        'text/html': blobHTML,
        'text/plain': blobText,
      });
      navigator.clipboard
        .write([clipboardItem])
        .then(() => showToast('Copied to clipboard!', 'success'))
        .catch(() => showToast('Failed to copy', 'error'));
    } catch (_e) {
      navigator.clipboard
        .writeText(csv)
        .then(() => showToast('Copied to clipboard!', 'success'))
        .catch(() => showToast('Failed to copy', 'error'));
    }
  }

  function resolveFunction(path) {
    if (!path || typeof path !== 'string') return null;
    const parts = path.split('.');
    let fn = window;
    for (const p of parts) fn = fn && fn[p];
    return typeof fn === 'function' ? fn : null;
  }

  function getLensBlocks(record, lensName) {
    const lensView = (record.views || {})[lensName];
    if (!lensView || !Array.isArray(lensView.blocks)) return [];
    return lensView.blocks.slice().sort((a, b) => Number(a.order || 0) - Number(b.order || 0));
  }

  function toArraySet(maybeSet) {
    return Array.from(maybeSet || []).sort((a, b) => a - b);
  }

  function buildViewerPayload(graphRef) {
    const assets = state.data.graph_assets || {};
    const layers = state.data.graph_layers || {};
    const asset = assets[graphRef] || {};
    return {
      base: asset.base || { legend: [], nodes: [], edges: [] },
      extensions: layers[graphRef] || {},
    };
  }

  const MAX_CACHED_VIEWERS = 10;

  function buildViewerCacheKey(mode, recordIndex, lensName, blockId) {
    if (mode === 'single') {
      return `single:${recordIndex}:${lensName}:${blockId}`;
    }
    return `compare:${lensName}:${blockId}`;
  }

  function evictViewerCache() {
    if (state.viewerCache.size < MAX_CACHED_VIEWERS) return;
    let oldestKey = null, oldestTime = Infinity;
    for (const [k, entry] of state.viewerCache) {
      if (entry.lastAccessed < oldestTime) {
        oldestTime = entry.lastAccessed;
        oldestKey = k;
      }
    }
    if (oldestKey) {
      const entry = state.viewerCache.get(oldestKey);
      try { entry.viewer.destroy(); } catch (_) {}
      state.viewerCache.delete(oldestKey);
    }
  }

  function destroyGraphRuntime() {
    const persistentCompares = new Set(
      Array.from(state.graphCompareInstances.values()).map(inst => inst.compare)
    );

    for (const compare of state.mountedCompares) {
      if (persistentCompares.has(compare)) continue;
      try {
        if (compare && typeof compare.destroy === 'function') compare.destroy();
      } catch (_e) {}
    }
    state.mountedCompares = [];

    for (const viewer of state.mountedViewers) {
      if (!viewer) continue;
      if (viewer.wrapper && viewer.wrapper.parentNode) {
        viewer.wrapper.parentNode.removeChild(viewer.wrapper);
      }
    }
    state.mountedViewers = [];
  }

  function destroyAllGraphCompares() {
    for (const [, inst] of state.graphCompareInstances) {
      try { inst.compare.destroy(); } catch (_) {}
    }
    state.graphCompareInstances.clear();
  }

  OBS.utils = {
    safeStr,
    escapeHtml,
    showToast,
    copyTable,
    resolveFunction,
    getLensBlocks,
    toArraySet,
    buildViewerPayload,
    destroyGraphRuntime,
    destroyAllGraphCompares,
    buildViewerCacheKey,
    evictViewerCache,
    MAX_CACHED_VIEWERS,
  };
})();

(function() {
  const OBS = window.__observatory;
  const state = OBS.state;
  const { escapeHtml } = OBS.utils;

  function renderLayout() {
    const icon = state.theme === 'dark' ? '☀️' : '🌙';
    OBS.app.innerHTML = `
      <div class="header-trigger"></div>
      <header>
        <div class="header-content">
          <h1>${escapeHtml(state.data.title || 'Observatory Report')}</h1>
          <div class="header-meta">
            <span>Generated: ${escapeHtml(state.data.generated_at || '')}</span>
          </div>
        </div>
        <div>
          <button class="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">
            <span class="theme-icon">${icon}</span>
          </button>
        </div>
      </header>
      <div class="container">
        <div class="index-pane-trigger"></div>
        <nav class="index-pane">
          <div class="index-header" id="index-header">
            <h2>Collected Graphs (${(state.data.records || []).length})</h2>
          </div>
          <ul id="index-list" class="index-list"></ul>
        </nav>
        <main id="main-pane" class="main-pane"></main>
      </div>
    `;
    updateIndexHeader();
  }

  function updateIndexHeader() {
    const header = document.getElementById('index-header');
    if (!header) return;

    if (state.selectionMode) {
      const total = (state.data.records || []).length;
      const allSelected = state.selectedIndices.size === total;
      header.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.9rem;font-weight:600;">Selected: ${state.selectedIndices.size}</span>
          <div>
            <button class="btn-sm" onclick="toggleSelectAll()">${allSelected ? 'Unselect All' : 'Select All'}</button>
            <button class="btn-sm" onclick="toggleSelectionMode()">Cancel</button>
          </div>
        </div>
      `;
      return;
    }

    header.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h2>Collected Graphs (${(state.data.records || []).length})</h2>
        <button class="btn-sm" onclick="toggleSelectionMode()">Select Items</button>
      </div>
    `;
  }

  function renderIndex() {
    const list = document.getElementById('index-list');
    if (!list) return;

    const records = state.data.records || [];
    let html = `
      <li class="index-item ${state.activeRecordIndex === -1 ? 'active' : ''}" onclick="selectRecord(-1)">
        <span>📊 Run Dashboard</span>
      </li>
    `;

    records.forEach((rec, idx) => {
      const isSelected = state.selectedIndices.has(idx);
      const checkbox = state.selectionMode
        ? `<input type="checkbox" class="selection-checkbox" ${isSelected ? 'checked' : ''} onclick="toggleSelect(${idx}, event)" style="margin-right:0.5rem;">`
        : '';

      let activeClass = '';
      if (state.selectionMode) {
        if (isSelected) activeClass = 'selected';
      } else if (typeof state.activeRecordIndex === 'object' && state.activeRecordIndex !== null) {
        if (state.activeRecordIndex.pool && state.activeRecordIndex.pool.includes(idx)) activeClass = 'selected';
        if (state.activeRecordIndex.base === idx) activeClass = 'diff-base';
        if (state.activeRecordIndex.new === idx) activeClass = 'diff-new';
      } else if (state.activeRecordIndex === idx) {
        activeClass = 'active';
      }

      const badges = (rec.badges || [])
        .map((b) => {
          const badgeClass = b.class || 'badge';
          const title = escapeHtml(b.title || b.label || '');
          const label = escapeHtml(b.label || '');
          return `<span class="badge ${badgeClass}" title="${title}">${label}</span>`;
        })
        .join('');

      if (rec.diff_index && Object.keys(rec.diff_index).length > 0 && idx > 0) {
        const rows = Object.entries(rec.diff_index)
          .map(([key, val]) => {
            const text = String(val);
            const plusMatch  = text.match(/\+((?:\d+\.?\d*)|(?:\.\d+))/);
            const minusMatch = text.match(/-((?:\d+\.?\d*)|(?:\.\d+))/);
            let stats = '';
            if (plusMatch || minusMatch) {
              if (plusMatch) stats += `<span class="stat-add">+${plusMatch[1]}</span>`;
              if (minusMatch) stats += `<span class="stat-rem">-${minusMatch[1]}</span>`;
            } else {
              stats = `<span>${escapeHtml(text)}</span>`;
            }
            return `
              <div class="diff-row">
                <span class="diff-label">${escapeHtml(key)}</span>
                <span class="diff-stats">${stats}</span>
              </div>
            `;
          })
          .join('');

        html += `
          <li class="diff-separator" onclick="showCompareView(${idx - 1}, ${idx})">
            <div class="diff-content">${rows}</div>
          </li>
        `;
      }

      html += `
        <li class="index-item ${activeClass}" onclick="selectRecord(${idx})">
          <div style="display:flex;align-items:center;overflow:hidden;flex:1;">
            ${checkbox}
            <div style="flex:1;min-width:0;">
              <div style="text-overflow:ellipsis;overflow:hidden;white-space:nowrap;">${escapeHtml(rec.name || '')}</div>
            </div>
          </div>
          <div class="badges">${badges}</div>
        </li>
      `;
    });

    list.innerHTML = html;
    updateIndexHeader();
  }

  OBS.layout = {
    renderLayout,
    renderIndex,
    updateIndexHeader,
  };
})();


// ---- 03_blocks.js ----

(function() {
  const OBS = window.__observatory;
  const state = OBS.state;
  const {
    safeStr,
    escapeHtml,
    copyTable,
    resolveFunction,
    getLensBlocks,
    toArraySet,
    buildViewerPayload,
    destroyGraphRuntime,
    buildViewerCacheKey,
    evictViewerCache,
  } = OBS.utils;

  function refreshCompareLayouts(container, options) {
    if (!container || !(state.graphCompareInstances instanceof Map)) return;
    for (const [, inst] of state.graphCompareInstances) {
      const compare = inst && inst.compare;
      if (!compare || !compare._root || !compare._root.isConnected) continue;
      if (container !== compare._root && !container.contains(compare._root)) continue;
      try {
        if (typeof compare.refreshLayout === 'function') {
          compare.refreshLayout(options || {});
        } else {
          for (const v of compare.viewers || []) {
            try { v.canvasRenderer.resize(); } catch (_) {}
            try {
              if (v.minimapRenderer) {
                v.minimapRenderer.resize();
                v.minimapRenderer.generateThumbnail();
              }
            } catch (_) {}
            try { v.renderAll(); } catch (_) {}
          }
        }
      } catch (_) {}
    }
  }

  function createSection(title, storageKey, collapsible) {
    const isCollapsible = collapsible !== false;
    const isCollapsed = isCollapsible && state.viewPrefs[storageKey] === false;

    const section = document.createElement('div');
    section.className = 'toggle-section';

    const header = document.createElement('div');
    header.className = `toggle-header ${isCollapsed ? 'collapsed' : ''}`;

    const titleSpan = document.createElement('span');
    titleSpan.className = 'toggle-title';
    titleSpan.textContent = title;
    header.appendChild(titleSpan);

    const content = document.createElement('div');
    content.className = `toggle-content ${isCollapsed ? 'hidden' : ''}`;

    if (isCollapsible) {
      header.onclick = () => {
        content.classList.toggle('hidden');
        header.classList.toggle('collapsed');
        const isExpanded = !content.classList.contains('hidden');
        state.viewPrefs[storageKey] = isExpanded;
        localStorage.setItem('graphCollectorViewPrefs', JSON.stringify(state.viewPrefs));
        if (isExpanded) {
          requestAnimationFrame(() => refreshCompareLayouts(content));
        }
      };
    }

    section.appendChild(header);
    section.appendChild(content);

    return { section, header, content };
  }

  function renderTableContent(content, data) {
    const table = document.createElement('table');
    table.className = 'kv-table';
    const tbody = document.createElement('tbody');

    const entries = Object.entries(data || {});
    if (entries.length === 0) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 2;
      td.textContent = '(empty)';
      tr.appendChild(td);
      tbody.appendChild(tr);
    } else {
      for (const [key, val] of entries) {
        const tr = document.createElement('tr');
        const th = document.createElement('th');
        th.textContent = key;
        const td = document.createElement('td');
        td.textContent = safeStr(val);
        tr.appendChild(th);
        tr.appendChild(td);
        tbody.appendChild(tr);
      }
    }

    table.appendChild(tbody);
    content.appendChild(table);
    return table;
  }

  function resolveViewerCtor() {
    if (typeof FXGraphViewer !== 'undefined') return FXGraphViewer;
    if (window && window.FXGraphViewer) return window.FXGraphViewer;
    return null;
  }

  function resolveGraphRef(graphRecord, fallbackGraphRef) {
    if (!graphRecord || typeof graphRecord !== 'object') return fallbackGraphRef || '';
    return (
      graphRecord.graph_ref ||
      graphRecord.graphRef ||
      graphRecord.record_name ||
      graphRecord.recordName ||
      fallbackGraphRef ||
      ''
    );
  }

  function mountGraphViewer(root, graphRecord, viewerOptions, fallbackGraphRef, cacheKey) {
    // Cache hit: reattach existing live viewer
    if (cacheKey && state.viewerCache.has(cacheKey)) {
      const entry = state.viewerCache.get(cacheKey);
      entry.lastAccessed = Date.now();
      root.appendChild(entry.wrapper);
      if (entry.viewer && entry.viewer.rootContainer !== root) {
        entry.viewer.rootContainer = root;
        if (entry.viewer.config && entry.viewer.config.mount) {
          entry.viewer.config.mount.root = root;
        }
        if (entry.viewer.config && entry.viewer.config._resolved) {
          entry.viewer.config._resolved.root = root;
        }
      }
      requestAnimationFrame(() => {
        try { entry.viewer.canvasRenderer.resize(); } catch (_) {}
        try { entry.viewer.renderAll(); } catch (_) {}
      });
      state.mountedViewers.push(entry.viewer);
      return entry.viewer;
    }

    // Cache miss: create new viewer
    const ViewerCtor = resolveViewerCtor();
    const graphRef = resolveGraphRef(graphRecord, fallbackGraphRef);

    if (!ViewerCtor || !graphRef) {
      const reason = !ViewerCtor ? 'FXGraphViewer unavailable' : 'graph_ref missing';
      root.innerHTML = `<div style="color:red">${reason}.</div>`;
      return null;
    }

    const payload = buildViewerPayload(graphRef);
    const defaultLayers = Array.isArray(graphRecord.default_layers) ? graphRecord.default_layers : [];
    const defaultColorBy = graphRecord.default_color_by || (defaultLayers.length > 0 ? defaultLayers[0] : 'base');

    const layoutMode = (viewerOptions || {}).layout_mode || 'full';
    let preset = 'split';
    if (layoutMode === 'compare_compact') preset = 'compact';
    if (layoutMode === 'headless') preset = 'headless';

    const viewer = ViewerCtor.create({
      payload,
      mount: { root },
      layout: { preset, fullscreen: { button: true } },
      state: { activeExtensions: defaultLayers, colorBy: defaultColorBy, themeName: state.theme },
    });

    // FIX: defer init() until after browser layout pass so getBoundingClientRect() is valid
    requestAnimationFrame(() => viewer.init());

    if ((viewerOptions || {}).sidebar_mode === 'hidden' && typeof viewer.setLayout === 'function') {
      try { viewer.setLayout({ panels: { sidebar: { visible: false } } }); } catch (_e) {}
    }
    if ((viewerOptions || {}).minimap_mode === 'off' && typeof viewer.setUIVisibility === 'function') {
      try { viewer.setUIVisibility({ minimapToggle: false }); } catch (_e) {}
    }

    if (cacheKey) {
      evictViewerCache();
      state.viewerCache.set(cacheKey, {
        viewer,
        wrapper: viewer.wrapper,
        lastAccessed: Date.now(),
      });
    }

    state.mountedViewers.push(viewer);
    return viewer;
  }

  function renderRecordBlock(container, lensName, block, context, analysis) {
    const storageKey = `${lensName}:${block.id}`;
    const title = block.title || block.id || lensName;
    const { section, header, content } = createSection(title, storageKey, block.collapsible);

    if (block.type === 'table') {
      const table = renderTableContent(content, block.record && block.record.data);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.innerText = 'Copy';
      copyBtn.onclick = (e) => {
        e.stopPropagation();
        copyTable(table);
      };
      header.appendChild(copyBtn);
    } else if (block.type === 'html') {
      const raw = (block.record && block.record.content) || '';
      let decoded = raw;
      try { decoded = atob(raw); } catch(_) {}
      content.innerHTML = decoded;
    } else if (block.type === 'custom') {
      const jsFunc = block.record && block.record.js_func;
      const fn = resolveFunction(jsFunc);
      if (!fn) {
        content.innerHTML = `<div style="color:red">Function ${escapeHtml(jsFunc || '')} not found</div>`;
      } else {
        try {
          fn(content, (block.record && block.record.args) || {}, context, analysis);
        } catch (err) {
          content.innerHTML = `<div style="color:red">JS Error: ${escapeHtml(err.message || String(err))}</div>`;
        }
      }
    } else if (block.type === 'graph') {
      const graphRoot = document.createElement('div');
      graphRoot.style.height = '1000px';
      graphRoot.style.minHeight = '800px';
      graphRoot.style.border = '1px solid var(--border-color)';
      graphRoot.style.borderRadius = '8px';
      graphRoot.style.overflow = 'hidden';
      content.appendChild(graphRoot);
      const fallbackGraphRef = (context && context.record && context.record.name) || '';
      const recordIndex = (context && context.index !== undefined) ? context.index : -1;
      const cacheKey = (recordIndex >= 0)
        ? buildViewerCacheKey('single', recordIndex, lensName, block.id || block.type)
        : null;
      mountGraphViewer(graphRoot, block.record || {}, (block.record && block.record.viewer_options) || {}, fallbackGraphRef, cacheKey);
    } else {
      content.innerHTML = `<div style="color:red">Unsupported block type: ${escapeHtml(block.type || '')}</div>`;
    }

    container.appendChild(section);
  }

  function renderDashboard(container) {
    container.innerHTML = '<h2>Run Dashboard</h2>';

    const dashboard = state.data.dashboard || {};
    let hasContent = false;

    for (const [lensName, viewList] of Object.entries(dashboard)) {
      const blocks = Array.isArray(viewList && viewList.blocks)
        ? viewList.blocks.slice().sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
        : [];
      if (blocks.length === 0) continue;

      const analysis = state.data.analysis_results && state.data.analysis_results[lensName];
      const context = {
        start: (state.data.session && state.data.session.start_data && state.data.session.start_data[lensName]) || {},
        end: (state.data.session && state.data.session.end_data && state.data.session.end_data[lensName]) || {},
        records: state.data.records || [],
      };

      for (const block of blocks) {
        renderRecordBlock(container, lensName, block, context, analysis);
        hasContent = true;
      }
    }

    if (!hasContent) container.innerHTML += '<p>No dashboard data available.</p>';
  }

  function renderTableCompare(content, entries) {
    const allKeys = new Set();
    for (const entry of entries) {
      const data = entry.block && entry.block.record && entry.block.record.data;
      if (!data || typeof data !== 'object') continue;
      Object.keys(data).forEach((k) => allKeys.add(k));
    }

    if (allKeys.size === 0) {
      content.innerHTML = '<p>No table data to compare.</p>';
      return null;
    }

    const table = document.createElement('table');
    table.className = 'kv-table comparison-table';

    const thead = document.createElement('thead');
    const headerRow = document.createElement('tr');
    const th0 = document.createElement('th');
    th0.textContent = 'Property';
    headerRow.appendChild(th0);

    for (const entry of entries) {
      const th = document.createElement('th');
      const span = document.createElement('span');
      span.className = 'clickable-name';
      span.textContent = entry.record.name || `record_${entry.idx}`;
      span.onclick = (e) => {
        e.stopPropagation();
        window.selectRecord(entry.idx, true);
      };
      th.appendChild(span);
      headerRow.appendChild(th);
    }

    thead.appendChild(headerRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (const key of Array.from(allKeys).sort()) {
      const tr = document.createElement('tr');
      const th = document.createElement('th');
      th.textContent = key;
      tr.appendChild(th);

      for (const entry of entries) {
        const td = document.createElement('td');
        const data = entry.block && entry.block.record && entry.block.record.data;
        td.textContent = data && data[key] !== undefined ? safeStr(data[key]) : '-';
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    content.appendChild(table);
    return table;
  }

  function renderHtmlCompare(content, entries) {
    const split = document.createElement('div');
    split.className = 'split-view';

    for (const entry of entries) {
      const pane = document.createElement('div');
      pane.className = 'split-pane';

      const h3 = document.createElement('h3');
      const span = document.createElement('span');
      span.className = 'clickable-name';
      span.textContent = entry.record.name || `record_${entry.idx}`;
      span.onclick = () => window.selectRecord(entry.idx, true);
      h3.appendChild(span);
      pane.appendChild(h3);

      const raw = (entry.block && entry.block.record && entry.block.record.content) || '';
      let decoded = raw;
      try { decoded = atob(raw); } catch(_) {}
      const div = document.createElement('div');
      div.innerHTML = decoded;
      pane.appendChild(div);
      split.appendChild(pane);
    }

    content.appendChild(split);
  }

  function renderCustomCompare(content, entries, compareSpec, sampleBlock, lensName, blockId) {
    const recordJsFunc = sampleBlock && sampleBlock.record && sampleBlock.record.js_func;
    const jsFunc = compareSpec.js_func || recordJsFunc || '';
    const fn = resolveFunction(jsFunc);
    if (!fn) {
      content.innerHTML = `<div style="color:red">Function ${escapeHtml(jsFunc)} not found</div>`;
      return;
    }

    const context = {
      indices: entries.map((e) => e.idx),
      names: entries.map((e) => e.record.name),
      records: entries.map((e) => e.record),
      blocks: entries.map((e) => e.block),
      lens: lensName,
      block_id: blockId,
    };

    try {
      fn(content, compareSpec.args || {}, context, state.data.analysis_results && state.data.analysis_results[lensName]);
    } catch (err) {
      content.innerHTML = `<div style="color:red">JS Error: ${escapeHtml(err.message || String(err))}</div>`;
    }
  }

  function ensureCompareInstance(content, allEntries, compareSpec, lensName, blockId) {
    const cacheKey = `${lensName}:${blockId}`;
    const cached = state.graphCompareInstances.get(cacheKey);

    if (cached) {
      content.appendChild(cached.compare._root);
      requestAnimationFrame(() => {
        if (typeof cached.compare.refreshLayout === 'function') {
          try { cached.compare.refreshLayout(); } catch (_) {}
          return;
        }
        for (const v of cached.compare.viewers) {
          try { v.canvasRenderer.resize(); } catch (_) {}
          try {
            if (v.minimapRenderer) {
              v.minimapRenderer.resize();
              v.minimapRenderer.generateThumbnail();
            }
          } catch (_) {}
          try { v.renderAll(); } catch (_) {}
        }
      });
      return cacheKey;
    }

    const placeholder = document.createElement('div');
    placeholder.className = 'loading';
    placeholder.textContent = 'Building graph compare view\u2026';
    content.appendChild(placeholder);

    buildCompareAsync(content, placeholder, compareSpec, lensName, blockId, cacheKey);
    return cacheKey;
  }

  async function buildCompareAsync(content, placeholder, compareSpec, lensName, blockId, cacheKey) {
    const CompareCtor = typeof FXGraphCompare !== 'undefined' ? FXGraphCompare : (window && window.FXGraphCompare);
    if (!CompareCtor) {
      if (placeholder) placeholder.innerHTML = '<span style="color:red">FXGraphCompare unavailable.</span>';
      return;
    }

    const records = state.data.records || [];
    const viewerMap = new Map();
    const nameToIndex = new Map();
    const isOnscreen = placeholder !== null;

    for (let idx = 0; idx < records.length; idx++) {
      if (isOnscreen && !content.isConnected) return;

      const record = records[idx];
      if (!record) continue;
      const blocks = getLensBlocks(record, lensName);
      const block = blocks.find(b => (b.id || `${lensName}_${b.type}`) === (blockId || `${lensName}_graph`));
      if (!block || block.type !== 'graph') continue;

      const graphRoot = document.createElement('div');
      graphRoot.style.height = '520px';
      graphRoot.style.minHeight = '360px';
      graphRoot.style.overflow = 'hidden';

      const options = Object.assign({}, (block.record && block.record.viewer_options) || {});
      const fallbackGraphRef = record.name || '';
      const viewer = mountGraphViewer(graphRoot, block.record || {}, options, fallbackGraphRef, null);
      if (!viewer) continue;

      const name = record.name || `record_${idx}`;
      viewerMap.set(name, viewer);
      nameToIndex.set(name, idx);

      await new Promise(resolve => requestAnimationFrame(resolve));
    }

    if (isOnscreen && !content.isConnected) return;

    if (viewerMap.size === 0) {
      if (placeholder) placeholder.innerHTML = '<span style="color:red">No graph viewers could be created.</span>';
      return;
    }

    if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);

    const compare = CompareCtor.create({
      viewers: viewerMap,
      layout: { container: content },
      sync: compareSpec.default_sync && compareSpec.default_sync.mode
        ? compareSpec.default_sync
        : { mode: 'auto' },
    });

    state.graphCompareInstances.set(cacheKey, { compare, nameToIndex });

    const compareViewerSet = new Set(viewerMap.values());
    state.mountedViewers = state.mountedViewers.filter(v => !compareViewerSet.has(v));

    const visibleIndices = getCurrentVisibleIndices();
    if (visibleIndices) syncCompareVisibility(cacheKey, visibleIndices);
  }

  function getCurrentVisibleIndices() {
    if (state.selectionMode) return toArraySet(state.selectedIndices);
    if (typeof state.activeRecordIndex === 'object' && state.activeRecordIndex !== null) {
      return state.activeRecordIndex.pool
        ? state.activeRecordIndex.pool
        : [state.activeRecordIndex.base, state.activeRecordIndex.new].filter(x => Number.isInteger(x));
    }
    return null;
  }

  async function warmCompareInstances() {
    const records = state.data.records || [];
    if (records.length < 2) return;

    const graphBlockIds = new Map();
    for (const record of records) {
      for (const lensName of Object.keys((record && record.views) || {})) {
        const blocks = getLensBlocks(record, lensName);
        for (const block of blocks) {
          if (block.type !== 'graph') continue;
          const id = block.id || `${lensName}_${block.type}`;
          const key = `${lensName}:${id}`;
          if (!graphBlockIds.has(key)) {
            graphBlockIds.set(key, { lensName, blockId: id, compareSpec: block.compare || {} });
          }
        }
      }
    }

    for (const [, spec] of graphBlockIds) {
      const cacheKey = `${spec.lensName}:${spec.blockId}`;
      if (state.graphCompareInstances.has(cacheKey)) continue;
      const offscreen = document.createElement('div');
      await buildCompareAsync(offscreen, null, spec.compareSpec, spec.lensName, spec.blockId, cacheKey);
    }
  }

  function syncCompareVisibility(cacheKey, visibleIndices) {
    const inst = state.graphCompareInstances.get(cacheKey);
    if (!inst) return;
    for (const [name, index] of inst.nameToIndex) {
      inst.compare.setViewerVisible(name, visibleIndices.includes(index));
    }
  }

  function defaultCompareMode(block) {
    if (!block) return 'disabled';
    if (block.type === 'table' || block.type === 'html' || block.type === 'graph') return 'auto';
    return 'disabled';
  }

  function renderCompareLens(recordView, lensName, indices) {
    const records = state.data.records || [];
    const entriesByBlock = new Map();

    for (const idx of indices) {
      const record = records[idx];
      if (!record) continue;
      const blocks = getLensBlocks(record, lensName);
      for (const block of blocks) {
        const id = block.id || `${lensName}_${block.type}`;
        if (!entriesByBlock.has(id)) entriesByBlock.set(id, []);
        entriesByBlock.get(id).push({ idx, record, block });
      }
    }

    const blockEntries = Array.from(entriesByBlock.values())
      .filter((list) => list.length > 0)
      .sort((a, b) => Number((a[0].block && a[0].block.order) || 0) - Number((b[0].block && b[0].block.order) || 0));

    for (const entries of blockEntries) {
      if (entries.length < 2) continue;

      const sample = entries[0].block;
      const compareSpec = sample.compare || {};
      const mode = compareSpec.mode || defaultCompareMode(sample);
      if (mode === 'disabled') continue;

      const blockLabel = sample.title || sample.id || sample.type;
      const sectionKey = `cmp:${lensName}:${sample.id}`;
      const { section, header, content } = createSection(`Comparison: ${lensName} / ${blockLabel}`, sectionKey, sample.collapsible);

      if (sample.type === 'table' && mode === 'auto') {
        const table = renderTableCompare(content, entries);
        if (table) {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.innerText = 'Copy';
          copyBtn.onclick = (e) => {
            e.stopPropagation();
            copyTable(table);
          };
          header.appendChild(copyBtn);
        }
      } else if (sample.type === 'html' && mode === 'auto') {
        renderHtmlCompare(content, entries);
      } else if (sample.type === 'graph' && mode === 'auto') {
        const cacheKey = ensureCompareInstance(content, entries, compareSpec, lensName, sample.id);
        syncCompareVisibility(cacheKey, indices);
      } else if (mode === 'custom') {
        renderCustomCompare(content, entries, compareSpec, sample, lensName, sample.id);
      } else {
        content.innerHTML = `<p>Compare mode '${escapeHtml(mode)}' for block type '${escapeHtml(sample.type)}' is not supported in minimal runtime.</p>`;
      }

      recordView.appendChild(section);
    }
  }

  function renderUnifiedView(container, indices) {
    const records = (state.data.records || []).filter((_, idx) => indices.includes(idx));
    const isSingle = indices.length === 1;
    const title = isSingle
      ? records[0].name
      : `Comparison (${indices.map((i) => (state.data.records || [])[i].name).join(' vs ')})`;

    container.innerHTML = `<div class="record-view"><h2>${escapeHtml(title)}</h2></div>`;
    const recordView = container.querySelector('.record-view');

    if (isSingle) {
      const idx = indices[0];
      const record = (state.data.records || [])[idx];
      let hasContent = false;

      for (const lensName of Object.keys((record && record.views) || {})) {
        const blocks = getLensBlocks(record, lensName);
        const analysis = state.data.analysis_results && state.data.analysis_results[lensName];
        const context = { index: idx, record };
        for (const block of blocks) {
          renderRecordBlock(recordView, lensName, block, context, analysis);
          hasContent = true;
        }
      }

      if (!hasContent) recordView.innerHTML += '<p>No views available for this record.</p>';
      return;
    }

    const allLenses = new Set();
    for (const idx of indices) {
      const record = (state.data.records || [])[idx];
      for (const lensName of Object.keys((record && record.views) || {})) {
        allLenses.add(lensName);
      }
    }

    for (const lensName of allLenses) {
      renderCompareLens(recordView, lensName, indices);
    }
  }

  function renderMain() {
    destroyGraphRuntime();

    const container = document.getElementById('main-pane');
    if (!container) return;
    container.innerHTML = '';

    if (state.selectionMode) {
      const indices = toArraySet(state.selectedIndices);
      if (indices.length === 0) {
        container.innerHTML = '<div class="loading">Select items to compare...</div>';
      } else {
        renderUnifiedView(container, indices);
      }
      return;
    }

    if (state.activeRecordIndex === -1) {
      renderDashboard(container);
      return;
    }

    if (typeof state.activeRecordIndex === 'object' && state.activeRecordIndex !== null) {
      const indices = state.activeRecordIndex.pool
        ? state.activeRecordIndex.pool
        : [state.activeRecordIndex.base, state.activeRecordIndex.new].filter((x) => Number.isInteger(x));
      renderUnifiedView(container, indices);
      return;
    }

    renderUnifiedView(container, [state.activeRecordIndex]);
  }

  OBS.render = {
    renderMain,
    renderDashboard,
    renderUnifiedView,
    mountGraphViewer,
    warmCompareInstances,
  };
})();


// ---- 04_actions.js ----

(function() {
  const OBS = window.__observatory;
  const state = OBS.state;
  const { renderIndex, updateIndexHeader } = OBS.layout;
  const { renderMain } = OBS.render;

  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    state.theme = theme;
    localStorage.setItem('graphCollectorTheme', theme);
    const icon = document.querySelector('.theme-icon');
    if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';

    // Sync theme to all mounted fx_viewer instances
    for (const viewer of (state.mountedViewers || [])) {
      try {
        if (typeof viewer.setTheme === 'function') viewer.setTheme(theme);
      } catch (_) {}
    }
    for (const [, inst] of (state.graphCompareInstances || new Map())) {
      const firstViewer = inst.compare.viewers[0];
      if (firstViewer && typeof firstViewer.setTheme === 'function') {
        try { firstViewer.setTheme(theme); } catch (_) {}
      }
    }
  }

  function toggleTheme() {
    setTheme(state.theme === 'light' ? 'dark' : 'light');
  }

  function showCompareView() {
    const indices = Array.from(arguments).filter((n) => Number.isInteger(n));
    state.activeRecordIndex = { pool: indices };
    renderIndex();
    renderMain();
  }

  function selectRecord(index, forceNavigate) {
    if (forceNavigate && state.selectionMode) {
      state.selectionMode = false;
      state.selectedIndices.clear();
    }

    if (state.selectionMode && index !== -1) {
      toggleSelect(index);
      return;
    }

    state.activeRecordIndex = index;
    renderIndex();
    renderMain();
  }

  function toggleSelectionMode() {
    state.selectionMode = !state.selectionMode;
    if (state.selectionMode) {
      state.selectedIndices.clear();
      if (typeof state.activeRecordIndex === 'number' && state.activeRecordIndex !== -1) {
        state.selectedIndices.add(state.activeRecordIndex);
      } else if (
        typeof state.activeRecordIndex === 'object' &&
        state.activeRecordIndex &&
        Array.isArray(state.activeRecordIndex.pool)
      ) {
        for (const idx of state.activeRecordIndex.pool) state.selectedIndices.add(idx);
      }
    } else {
      state.selectedIndices.clear();
    }

    updateIndexHeader();
    renderIndex();
    renderMain();
  }

  function toggleSelectAll() {
    const records = state.data.records || [];
    if (state.selectedIndices.size === records.length) {
      state.selectedIndices.clear();
    } else {
      state.selectedIndices = new Set(records.map((_, i) => i));
    }
    renderIndex();
    renderMain();
  }

  function toggleSelect(idx, event) {
    if (event) event.stopPropagation();
    if (state.selectedIndices.has(idx)) {
      state.selectedIndices.delete(idx);
    } else {
      state.selectedIndices.add(idx);
    }
    renderIndex();
    renderMain();
  }

  OBS.actions = {
    setTheme,
    toggleTheme,
    showCompareView,
    selectRecord,
    toggleSelectionMode,
    toggleSelectAll,
    toggleSelect,
  };

  window.setTheme = setTheme;
  window.toggleTheme = toggleTheme;
  window.showCompareView = showCompareView;
  window.selectRecord = selectRecord;
  window.toggleSelectionMode = toggleSelectionMode;
  window.toggleSelectAll = toggleSelectAll;
  window.toggleSelect = toggleSelect;
})();


// ---- 05_bootstrap_api.js ----

(function() {
  const OBS = window.__observatory;
  const state = OBS.state;
  const { renderLayout, renderIndex } = OBS.layout;
  const { renderMain, mountGraphViewer } = OBS.render;
  const { showToast } = OBS.utils;
  const actions = OBS.actions;

  function wrapGraphHandle(viewer) {
    return {
      setLayers(layerIds) {
        if (viewer && typeof viewer.setLayers === 'function') viewer.setLayers(layerIds || []);
      },
      setColorBy(layerId) {
        if (viewer && typeof viewer.setColorBy === 'function') viewer.setColorBy(layerId);
      },
      updateLayerNodeStyle(layerId, nodeId, patch) {
        if (!viewer || typeof viewer.patchLayerNodes !== 'function') return;
        const payload = {};
        payload[nodeId] = patch || {};
        viewer.patchLayerNodes(layerId, payload);
      },
      selectNode(nodeId, opts) {
        if (viewer && typeof viewer.selectNode === 'function') viewer.selectNode(nodeId, opts || {});
      },
      zoomToFit() {
        if (viewer && typeof viewer.zoomToFit === 'function') viewer.zoomToFit();
      },
      setSyncEnabled(enabled) {
        if (viewer && typeof viewer.setState === 'function') {
          try {
            viewer.setState({ syncSelection: !!enabled });
          } catch (_e) {}
        }
      },
      enterFullscreen() {
        if (viewer && typeof viewer.enterFullscreen === 'function') viewer.enterFullscreen();
      },
      exitFullscreen() {
        if (viewer && typeof viewer.exitFullscreen === 'function') viewer.exitFullscreen();
      },
      onNodeSelected(callback) {
        if (viewer && typeof viewer.on === 'function') {
          viewer.on('selectionchange', callback);
        }
      },
      destroy() {
        if (viewer && typeof viewer.destroy === 'function') viewer.destroy();
      },
      _viewer: viewer,
    };
  }

  window.ObservatoryAPI = {
    mountGraph(container, graphRef, options) {
      let root = container;
      if (typeof container === 'string') root = document.querySelector(container);
      if (!root) throw new Error('mountGraph: container not found');

      const graphRecord = {
        graph_ref: graphRef,
        default_layers: (options && options.default_layers) || [],
        default_color_by: options && options.default_color_by,
        viewer_options: (options && options.viewer_options) || {},
      };

      const viewer = mountGraphViewer(root, graphRecord, graphRecord.viewer_options);
      if (!viewer) throw new Error('mountGraph: failed to mount viewer');
      return wrapGraphHandle(viewer);
    },

    selectRecord(index) {
      actions.selectRecord(index, true);
    },

    openCompare(indices) {
      if (!Array.isArray(indices) || indices.length === 0) return;
      state.activeRecordIndex = { pool: indices.slice() };
      renderIndex();
      renderMain();
    },

    showSingleRecord(index) {
      actions.selectRecord(index, true);
    },

    showToast(message, type) {
      showToast(message, type || 'success');
    },

    getContext() {
      return {
        activeRecordIndex: state.activeRecordIndex,
        selectionMode: state.selectionMode,
        selectedIndices: Array.from(state.selectedIndices),
        records: state.data.records || [],
      };
    },
  };

  function setupDelegatedActions() {
    document.body.addEventListener('click', (event) => {
      const target = event.target && event.target.closest && event.target.closest('[data-ob-action]');
      if (!target) return;

      const action = target.getAttribute('data-ob-action');
      if (action === 'select-record') {
        const rec = Number(target.getAttribute('data-ob-record'));
        if (Number.isInteger(rec)) actions.selectRecord(rec, true);
        return;
      }

      if (action === 'open-compare') {
        const raw = target.getAttribute('data-ob-indices') || '';
        const indices = raw
          .split(',')
          .map((v) => Number(v.trim()))
          .filter((v) => Number.isInteger(v));
        if (indices.length > 0) window.ObservatoryAPI.openCompare(indices);
        return;
      }

      if (action === 'graph-focus-node') {
        const nodeId = target.getAttribute('data-ob-node-id');
        if (!nodeId) return;
        const firstViewer = state.mountedViewers && state.mountedViewers[0];
        if (firstViewer && typeof firstViewer.selectNode === 'function') {
          firstViewer.selectNode(nodeId, { center: true, animate: true });
        }
      }
    });
  }

  function init() {
    actions.setTheme(state.theme);
    renderLayout();
    renderIndex();
    renderMain();
    setupDelegatedActions();

    if (OBS.render.warmCompareInstances) {
      requestAnimationFrame(() => OBS.render.warmCompareInstances());
    }
  }

  init();
})();

        })();
    </script>
